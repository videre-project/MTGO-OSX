name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Select build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      run-id: ${{ steps.build.outputs.run-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Select build
        id: build
        shell: bash
        run: |
          python3 tools/release.py --repository "$GH_REPO" notes --tag "$RELEASE_TAG" > /dev/null
          commit=$(git rev-parse HEAD)
          # GitHub can queue a tag push before the matching main build appears.
          printf 'Waiting for a main build for %s.\n' "$commit"
          for attempt in {1..18}; do
            run_id=$(gh run list --workflow build.yml --branch main --commit "$commit" \
              --limit 20 --json databaseId,event \
              --jq '[.[] | select(.event == "push" or .event == "workflow_dispatch")][0].databaseId')
            if [[ "$run_id" =~ ^[0-9]+$ ]]; then break; fi
            if (( attempt < 18 )); then sleep 10; fi
          done
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            printf 'No main build found for %s. Push the tagged commit to main or run Build on main, then rerun Release.\n' "$commit" >&2
            exit 1
          fi
          printf 'Using build %s for commit %s.\n' "$run_id" "$commit"
          gh run watch "$run_id" --exit-status --interval 30
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

  package:
    name: Sign and package on macOS
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: MTGO-macos
          path: build
          run-id: ${{ needs.build.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Package release
        run: |
          python3 tools/release.py --repository "$GH_REPO" package \
            --directory build --tag "$RELEASE_TAG" --build-number "$GITHUB_RUN_NUMBER" --output dist
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: MTGO-release
          path: dist/
          compression-level: 0
          if-no-files-found: error

  release:
    name: Prepare draft release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: MTGO-release
          path: dist
      - name: Verify release assets
        run: python3 tools/release.py --repository "$GH_REPO" verify --directory dist --tag "$RELEASE_TAG"
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/MTGO-OSX-*.dmg
            dist/runtime-*.tar.xz
            dist/RuntimePackages.json
      - name: Prepare release
        shell: bash
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            test "$draft" = true || { echo 'Published releases cannot be replaced.' >&2; exit 1; }
            gh release edit "$RELEASE_TAG" --title "MTGO-OSX $RELEASE_TAG"
          else
            python3 tools/release.py --repository "$GH_REPO" notes --tag "$RELEASE_TAG" \
              > "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" --draft --verify-tag \
              --notes-file "$RUNNER_TEMP/release-notes.md" --title "MTGO-OSX $RELEASE_TAG"
          fi
          gh release upload "$RELEASE_TAG" "dist/MTGO-OSX-${RELEASE_TAG#v}.dmg" \
            dist/runtime-*.tar.xz dist/RuntimePackages.json --clobber
