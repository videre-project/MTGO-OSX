name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      test_intel: true

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: MTGO-macos
          path: dist
      - name: Verify release assets
        run: python3 tools/release.py --repository "$GH_REPO" verify --directory dist --tag "$RELEASE_TAG"
      - name: Prepare release
        shell: bash
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            test "$draft" = true || { echo 'Published releases cannot be replaced.' >&2; exit 1; }
          else
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes \
              --title "MTGO ${RELEASE_TAG#v}"
          fi
          gh release upload "$RELEASE_TAG" "dist/MTGO-${RELEASE_TAG#v}.dmg" \
            dist/runtime-*.tar.xz dist/RuntimePackages.json --clobber
