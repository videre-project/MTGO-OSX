name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Select build
        id: build
        shell: bash
        run: |
          commit=$(git rev-parse HEAD)
          run_id=$(gh run list --workflow build.yml --branch main --event push \
            --commit "$commit" --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            printf 'No successful main build exists for %s. Complete build CI before retrying this release.\n' "$commit" >&2
            exit 1
          fi
          printf 'Using build %s for commit %s.\n' "$run_id" "$commit"
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: MTGO-macos
          path: dist
          run-id: ${{ steps.build.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Verify release assets
        run: python3 tools/release.py --repository "$GH_REPO" verify --directory dist --tag "$RELEASE_TAG"
      - name: Prepare release
        shell: bash
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            test "$draft" = true || { echo 'Published releases cannot be replaced.' >&2; exit 1; }
          else
            sed -e "s|@VERSION@|${RELEASE_TAG#v}|g" -e "s|@REPOSITORY@|$GH_REPO|g" \
              .github/release-notes.md > "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes \
              --notes-file "$RUNNER_TEMP/release-notes.md" --title "MTGO ${RELEASE_TAG#v}"
          fi
          gh release upload "$RELEASE_TAG" "dist/MTGO-${RELEASE_TAG#v}.dmg" \
            dist/runtime-*.tar.xz dist/RuntimePackages.json --clobber
