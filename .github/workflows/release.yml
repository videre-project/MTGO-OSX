name: Release

on:
  push:
    tags: ['v[0-9]*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}
  RELEASE_TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Select build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: read
    outputs:
      run-id: ${{ steps.build.outputs.run-id }}
    steps:
      - uses: actions/checkout@v4
      - name: Select build
        id: build
        shell: bash
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Release tags must use v<major>.<minor>.<patch>.' >&2; exit 1; }
          commit=$(git rev-parse HEAD)
          run_id=$(gh run list --workflow build.yml --branch main --event push \
            --commit "$commit" --limit 1 --json databaseId --jq '.[0].databaseId')
          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            printf 'No main build exists for %s. Push the release commit to main before retrying this release.\n' "$commit" >&2
            exit 1
          fi
          printf 'Using build %s for commit %s.\n' "$run_id" "$commit"
          gh run watch "$run_id" --exit-status --interval 30
          printf 'run-id=%s\n' "$run_id" >> "$GITHUB_OUTPUT"

  package:
    name: Sign and package on macOS
    needs: build
    runs-on: macos-15
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: MTGO-macos
          path: build
          run-id: ${{ needs.build.outputs.run-id }}
          github-token: ${{ github.token }}
      - name: Package release
        run: |
          python3 tools/release.py --repository "$GH_REPO" package \
            --directory build --tag "$RELEASE_TAG" --build-number "$GITHUB_RUN_NUMBER" --output dist
      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: MTGO-release
          path: dist/
          compression-level: 0
          if-no-files-found: error

  release:
    name: Prepare draft release
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          name: MTGO-release
          path: dist
      - name: Verify release assets
        run: python3 tools/release.py --repository "$GH_REPO" verify --directory dist --tag "$RELEASE_TAG"
      - name: Attest release assets
        uses: actions/attest@v4
        with:
          subject-path: |
            dist/MTGO-*.dmg
            dist/runtime-*.tar.xz
            dist/RuntimePackages.json
      - name: Prepare release
        shell: bash
        run: |
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft); then
            test "$draft" = true || { echo 'Published releases cannot be replaced.' >&2; exit 1; }
          else
            sed -e "s|@VERSION@|${RELEASE_TAG#v}|g" -e "s|@REPOSITORY@|$GH_REPO|g" \
              .github/release-notes.md > "$RUNNER_TEMP/release-notes.md"
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes \
              --notes-file "$RUNNER_TEMP/release-notes.md" --title "MTGO ${RELEASE_TAG#v}"
          fi
          gh release upload "$RELEASE_TAG" "dist/MTGO-${RELEASE_TAG#v}.dmg" \
            dist/runtime-*.tar.xz dist/RuntimePackages.json --clobber
